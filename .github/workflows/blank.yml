name: Auto-Sync All Branches

on:
  push:
    branches:
      - main

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync branches from main
        run: |
          git fetch origin
          
          # Iterate over all remote branches, excluding main and HEAD pointers
          for remote_branch in $(git branch -r | grep 'origin/' | grep -v 'origin/main' | grep -v 'HEAD'); do
            branch=${remote_branch#origin/}
            echo "Checking branch: $branch"
            
            git checkout "$branch"
            
            # Attempt to merge main into the branch
            if git merge origin/main --no-edit; then
              git push origin "$branch"
              echo "Successfully synced $branch."
            else
              echo "Conflict detected in $branch. Aborting merge and skipping."
              git merge --abort
            fi
          done
